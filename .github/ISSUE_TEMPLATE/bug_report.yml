name: Bug report
description: Something in the app is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a session of 10
        2. Skip the second problem
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: v22.11.0

  - type: textarea
    id: logs
    attributes:
      label: Server or console output
      render: text
